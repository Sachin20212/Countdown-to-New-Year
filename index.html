<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown to New Year</title>
    <style>
        body{
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: slateblue;
        }

        h2{
            min-width: 400px;
            color: #fff;
            text-transform: uppercase;
            font-size: clamp(1.5rem, 4rem, 5vw);
            letter-spacing: 4px;
            font-weight: 700;
        }
        .year{
            font-size: clamp(9rem, 15rem, 20vw);
            color: white;
            font-weight: bold;
        }

        .countdown{
            margin: 30px;
            background-color: rgba(0, 0, 0, 0.1);
            width: 100%;
            color: #fff;
            display: flex;
            height: 120px;
            align-items: center;
            justify-content: center;
        }
        .countdown div{
            margin: 0 25px;
            width: 100px;
            font-size: clamp(2.2rem, 2.9rem, 20vw);
            font-weight: 500;
            margin-top: -25px;
            position: relative;
            text-align: center;
        }
        .countdown div::before{
            content: "";
            position: absolute;
            bottom: -30px;
            left: 0;
            margin-right: 10px;
            font-size: 0.8rem;
            line-height: 35px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
            width: 100%;
            height: 35px;
        }

        .countdown #day::before{
            content: "Days";
        }
        .countdown #hour::before{
            content: "Hours";
        }
        .countdown #minute::before{
            content: "Hinutes";
        }
        .countdown #second::before{
            content: "Seconds";
        }
        @media (max-width: 1080px) {
            h2{
                text-align: center;
            }            
            .countdown{
                width: 100%;
            }
            .countdown div{
                min-width: 40px;
            }
            .countdown #day::before{
                content: "Days";
                left: 7px;
            }
            .countdown #hour::before{
                content: "Hours";
                left: 2px;
            }
            .countdown #minute::before{
                content: "Hinutes";
                left: -5px;
            }
            .countdown #second::before{
                content: "Seconds";
                left: -2px;
                left: -5px;
            }
        }
    </style>
</head>
<body>
    <h2>Countdown to New Year</h2>
    <div class="year">2027</div>
    <div class="countdown">
        <div id="day">00</div>
        <div id="hour">00</div>
        <div id="minute">00</div>
        <div id="second">00</div>
    </div>
    
    <script>
        const dayE1 = document.getElementById("day");
        const hourE1 = document.getElementById("hour");
        const minuteE1 = document.getElementById("minute");
        const secondE1 = document.getElementById("second");

        updateCountDown();

        function updateCountDown(){
            const newYear = new Date("January 1, 2027 00:00:00")
            const currentTIme = new Date()

            const second = 1000;
            const minute = second * 60;
            const hour = minute * 60;
            const day = hour * 24;

            const gap = (newYear - currentTIme)

            const d = Math.floor(gap / day);
            const h = Math.floor((gap % day) / hour );
            const m = Math.floor((gap % hour) / minute);
            const s = Math.floor((gap % minute) / second);

            dayE1.innerText = d;
            hourE1.innerText = h;
            minuteE1.innerText = m;
            secondE1.innerText = s;
            setTimeout(updateCountDown, 1000);
        }

    </script>
</body>
</html>
